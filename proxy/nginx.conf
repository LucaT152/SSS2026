events {}

http {  #sono i blocchi strutturali obbligatori di Nginx per dirgli che dovrà gestire traffico web (HTTP).
    server { #crea un server virtuale che ascolta sulla porta 80
        listen 80;

        location / {   #è la regola "generale". Se l'utente chiede qualsiasi pagina (es. /, /home, /login), Nginx gira la richiesta al container chiamato frontend sulla sua porta 80
            proxy_pass http://frontend:80;
        }

        location /api/ {  #è la regola "specifica". Se l'URL inizia con /api/, Nginx capisce che sono dati e non pagine grafiche, quindi gira la richiesta al container backend sulla sua porta 8000
            proxy_pass http://backend:8000;
        }
    }
}