
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio primo container</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #222;
            text-align: center;
            padding: 80px 20px;
        }

        main {
            max-width: 600px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
        }

        h1 {
            color: #0877bd;
        }

        button {
            padding: 12px 20px;
            background: #0877bd;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #055a91;
        }
    </style>
</head>

<body>
    <main>
        <h1>Ciao Docker!</h1>

        <p>Questa pagina viene servita da Nginx.</p>

        <p id="messaggio">
            Premi il pulsante per rendere dinamica la pagina!
        </p>

        <button onclick="cambiaMessaggio()">
            Cliccami!
        </button>
    </main>

    <script>
        function cambiaMessaggio() {
            document.getElementById("messaggio").textContent =
                "Complimenti! Il pulsante funziona!";
        }
    </script>
</body>
</html>
